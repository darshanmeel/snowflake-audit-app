# Threshold overrides ONLY -- shape: {<query_id>: {<param>: value}, _all: {<param>: value}}.
# The export looks up [query_id][name], then ['_all'][name], then the check's own header default;
# first match wins. An empty file is valid: every threshold not listed here falls through to its
# header default. The Settings page renders its editor from the registry's params, not from this
# file's keys alone.

# The access log (Activity › Access log): one row per UTC day; bucket_hours: 1 gives one per UTC hour (up to
# 24 times the rows). Off-hours use by people is judged at business_utc_offset (hours ahead of UTC, e.g. 1
# for Zurich in winter, -5 for New York); the page can shift it to compare. Numbers only. Next export.
# sf_use_access_log:
#   bucket_hours: 24
#   lookback_days: 90
# sf_use_access_hours:
#   business_utc_offset: 0
#   business_start_hour: 7
#   business_end_hour: 19
