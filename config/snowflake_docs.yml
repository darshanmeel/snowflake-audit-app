# config/snowflake_docs.yml -- docs.snowflake.com links for the Guide tab.
# One entry per view / SHOW command / function the checks read (app/core/registry.py SOURCE_CONTRACT);
# key = "<schema>.<name>". app/core/snowflake_docs.py loads this file; URLs are never written in .jsx.
# URL rule: account-usage/<view>, organization-usage/<view>, reader-account-usage/<view>,
# data-sharing-usage/<view> (view lower-case) and sql/show-<object> for SHOW, all under
# https://docs.snowflake.com/en/sql-reference/. Entries with a different page (Trust Center, Budgets,
# a function) are set by hand. Generated from the checks' reads; every URL answered HTTP 200 when last checked. READER_ACCOUNT_USAGE views are documented on the account-usage page, not one page each.
# `concepts` (below `sources`) are the Guide's concept links: read by app/api/guide.py only, key = a slug the Guide names.

version: 1

